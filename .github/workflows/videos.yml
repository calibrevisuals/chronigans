name: Update video list
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/videos.mjs
      - run: node .github/scripts/titles.mjs
      - name: Commit if changed
        run: |
          git add videos.json sources index.html
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git config user.name "chronigans-bot"
          git config user.email "contact@chronigans.com"
          git commit -m "Update video list and titles"
          git push
